[mgr]
prepend_keymap = [
	{ on = [ "g", "p"], run = "cd ~/Documents/Projetos/Programação/",
		desc = "cd Programação" },

	{ on = [ "g", "w"], run = "cd ~/Documents/Projetos/Programação/WebDev",
		desc = "cd WebDev" },

	{ on = [ "g", "."], run = "cd ~/.dotfiles",
		desc = "cd dotfiles" },

  { on = ["E", "v"], run = "shell 'code .'",
    desc = "Open Vscode :3" },

  { on = ["E", "l"], run = "shell 'lazygit'",
    desc = "Open lazygit :D" },

]
append_keymap = [
]

