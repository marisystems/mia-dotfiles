# -- Setup -- #

# Remap prefix from <ctrl-b> to <ctlr-a>
unbind C-b
set-option -g prefix C-a
bind-key C-a send prefix

# Split panes with | and - at CWD
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Source config
bind r source-file ~/.tmux.conf

# Switch panes using meta(alt in this case)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse
set -g mouse on

# Use all colors
set-option -g default-terminal "screen-256color"  # use 256 colors

# More history buffer
set-option -g history-limit 100000

# Make it more responsive
set-option -g repeat-time 0

# Make it use fish shell
set -g default-command fish

# Floating terminal
bind j popup -d '#{pane_current_path}' -h 70% -w 70%
bind J run-shell '~/.tmux/scripts/popup-tmux.sh'

# ====================
# Ttmux Plugin Manager
# ====================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'rose-pine/tmux'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
