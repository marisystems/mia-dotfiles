- defaults:
    link:
      relink: true

- link:
    ~/:
      glob: true
      path: files/bash/.*

    ~/.config/kitty: 
      glob: true
      path: files/kitty/*

    ~/.config/fish/:
      glob: true
      path: files/fish/*
      create: true

    ~/.config/yazi:
      path: files/yazi/*
      glob: true
      create: true

    ~/.config/nvim:
      path: modules/mia-nvim/*
      glob: true
      create: true

    ~/:
      path: files/zsh/.*
      glob: true
      exclude: zsh/ohmyzsh

    ~/.gitconfig: files/.gitconfig

    ~/.tmux.conf: files/.tmux.conf

    ~/.config/hypr:
      path: files/hypr/hyprland/*
      glob: true
      create: true
      force: true

    ~/.env.sh: files/.env.sh

